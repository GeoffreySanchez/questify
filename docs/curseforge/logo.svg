<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo Questify : un « Q » formé d'une boussole (l'anneau) et d'un trajet pointillé qui mène à un repère. -->
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#22565e"/>
      <stop offset="0.6" stop-color="#10292f"/>
      <stop offset="1" stop-color="#081418"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#efbf4e"/>
      <stop offset="1" stop-color="#a8721f"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="1" stop-color="#e3cf9e"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f07a52"/>
      <stop offset="1" stop-color="#b8361f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- lignes de niveau façon carte -->
  <g fill="none" stroke="#3b7f87" stroke-opacity="0.28" stroke-width="3">
    <path d="M -10 120 C 80 90, 150 140, 240 110 S 420 60, 530 100"/>
    <path d="M -10 400 C 60 370, 120 430, 200 420 S 300 470, 360 500"/>
    <path d="M 420 150 C 470 190, 480 250, 530 270"/>
    <path d="M -10 260 C 20 250, 40 280, 60 300"/>
  </g>

  <g filter="url(#shadow)">
    <!-- anneau du Q -->
    <circle cx="234" cy="226" r="134" fill="none" stroke="url(#gold)" stroke-width="34"/>
    <circle cx="234" cy="226" r="104" fill="none" stroke="#f3e6c4" stroke-opacity="0.22" stroke-width="3"/>

    <!-- graduations -->
    <g stroke="#f3e6c4" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
      <line x1="234" y1="132" x2="234" y2="146"/>
      <line x1="328" y1="226" x2="314" y2="226"/>
      <line x1="234" y1="320" x2="234" y2="306"/>
      <line x1="140" y1="226" x2="154" y2="226"/>
    </g>

    <!-- rose des vents -->
    <polygon points="234,150 248,212 310,226 248,240 234,302 220,240 158,226 220,212" fill="url(#ivory)"/>
    <polygon points="234,150 248,212 234,226 220,212" fill="#efbf4e"/>
    <polygon points="234,226 248,240 234,302 220,240" fill="#c99a3a" fill-opacity="0.55"/>
    <g fill="#efbf4e" fill-opacity="0.75">
      <polygon points="282,178 246,218 238,212"/>
      <polygon points="186,274 222,234 230,240"/>
      <polygon points="282,274 242,238 248,230"/>
      <polygon points="186,178 226,214 220,222"/>
    </g>
    <circle cx="234" cy="226" r="11" fill="#10292f" stroke="#efbf4e" stroke-width="5"/>

    <!-- queue du Q : le trajet vers le repère -->
    <path d="M 318 316 C 344 344, 362 352, 384 368" fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round"/>
    <path d="M 386 372 C 396 380, 402 386, 404 392" fill="none" stroke="#f3e6c4" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18"/>

    <!-- repère -->
    <path d="M 414 486 C 384 446, 370 424, 370 402 a 44 44 0 1 1 88 0 c 0 22 -14 44 -44 84 z"
          fill="url(#pin)" stroke="#5e1a0f" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="414" cy="402" r="16" fill="url(#ivory)"/>
  </g>
</svg>
