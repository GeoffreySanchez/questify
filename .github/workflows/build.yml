# Construit le zip de l'addon (WoW: Forever) à chaque push sur main
# et le publie dans la release « latest » du dépôt, prêt à télécharger.
# Les tags vX.Y.Z sont publiés par release.yml.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer LuaJIT et zip
        run: sudo apt-get update && sudo apt-get install -y luajit zip unzip

      - name: Construire le zip
        env:
          # La validation des guides lit un clone QuestieDB local (.cache/) absent en CI ;
          # les guides sont validés avant chaque commit sur le poste de dev.
          SKIP_GUIDE_VALIDATION: "1"
        run: bash tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: questify-zips
          path: dist/*.zip

      - name: Publier la release « latest » (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dernier build (main)" \
            --notes "Build automatique du commit $GITHUB_SHA. WoW: Forever : Questify-*-forever.zip."

